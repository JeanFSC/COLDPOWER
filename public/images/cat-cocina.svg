<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Cocinas</title>
  <desc id="desc">Hornillas, chisperos y válvulas a gas</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1320"/>
      <stop offset="1" stop-color="#1A2233"/>
    </linearGradient>
    <radialGradient id="glow" cx=".74" cy=".22" r=".6">
      <stop offset="0" stop-color="#EAB308" stop-opacity=".38"/>
      <stop offset="1" stop-color="#EAB308" stop-opacity="0"/>
