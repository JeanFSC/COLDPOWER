      <stop offset="0" stop-color="#0E1320"/>
      <stop offset="1" stop-color="#1A2233"/>
    </linearGradient>
    <radialGradient id="glow" cx=".74" cy=".22" r=".6">
      <stop offset="0" stop-color="#0FB5A6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0FB5A6" stop-opacity="0"/>
