  <g transform="translate(360 90) rotate(10 130 130)">
    <circle cx="130" cy="130" r="130" fill="#1F2A3D" stroke="#7C5CFC" stroke-width="10"/>
    <g fill="#7C5CFC">
      <ellipse cx="130" cy="60" rx="26" ry="58"/>
