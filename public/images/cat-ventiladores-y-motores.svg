      <ellipse cx="130" cy="60" rx="26" ry="58" transform="rotate(240 130 130)"/>
    </g>
    <circle cx="130" cy="130" r="26" fill="#0E1320" stroke="#E6EAF0" stroke-width="6"/>
  </g>
  <text x="48" y="576" fill="#ffffff" font-family="'Sora',Arial,sans-serif" font-size="30" font-weight="900">Ventiladores y motores</text>
  <text x="48" y="610" fill="#B8C0CC" font-family="Arial,sans-serif" font-size="16" font-weight="600">Motoventiladores para ventilación mecánica</text>
